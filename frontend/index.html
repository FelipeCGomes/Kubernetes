<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIO - Kubernetes no GCP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <span class="badge">DIO • Docker • Kubernetes • GCP</span>
      <h1>Pipeline de Deploy</h1>
      <p class="subtitle">Aplicação containerizada e preparada para execução em um cluster Kubernetes.</p>

      <form id="contact-form">
        <label for="name">Nome</label>
        <input id="name" name="nome" type="text" required>

        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required>

        <label for="comment">Comentário</label>
        <textarea id="comment" name="comentario" rows="5" required></textarea>

        <button type="submit">Enviar mensagem</button>
      </form>

      <p id="status" role="status"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
